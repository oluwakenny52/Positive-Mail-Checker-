[theme]
base = "dark"
primaryColor = "#4f8bf9"
backgroundColor = "#0e1117"
secondaryBackgroundColor = "#1a1d24"
textColor = "#fafafa"
font = "sans serif"

[server]
headless = true
maxUploadSize = 60
fileWatcherType = "none"

[runner]
fastReruns = true

[client]
showErrorDetails = true
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
