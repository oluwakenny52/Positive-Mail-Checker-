name: frame-gates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# v13.51: no cancel-in-progress on push. A rapid second push CANCELLED the first
# gate run, so a red commit could be masked by the next one.
concurrency:
  group: frame-gates-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  gates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: 1. fix_end_names --check
        id: g1
        if: always()
        run: python3 fix_end_names.py --check

      - name: 2. verify_blocks
        id: g2
        if: always()
        run: python3 verify_blocks.py

      - name: 3. audit_frame
        id: g3
        if: always()
        run: python3 audit_frame.py

      - name: 4. verify_v1337
        id: g4
        if: always()
        run: python3 verify_v1337.py

      - name: 5. test_verdicts
        id: g5
        if: always()
        run: python3 test_verdicts.py

      - name: 6. engine --selftest
        id: g6
        if: always()
        run: python3 engine.py --selftest

      - name: 7. status alias_selftest
        id: g7
        if: always()
        run: python3 status.py --selftest

      - name: 8. auth --selftest
        id: g8
        if: always()
        run: python3 auth.py --selftest

      - name: 9. compileall
        id: g9
        if: always()
        run: python3 -m compileall -q .

      - name: 10. requirements resolve
        id: g10
        if: always()
        run: python3 -m pip install -r requirements.txt

      - name: 11. blocks fix-check
        id: g11
        if: always()
        run: python3 pages/5_Blocks.py --fix-check

      - name: 12. runstate selftest
        id: g12
        if: always()
        run: python3 runstate.py --selftest

      - name: 13. resume io
        id: g13
        if: always()
        run: python3 test_resume_io.py

      - name: 14. app block count
        id: g14
        if: always()
        run: test "$(grep -c '^# @@BLOCK ' app.py)" -eq 111

      - name: 15. app end marker count
        id: g15
        if: always()
        run: test "$(grep -c '^# @@END ' app.py)" -eq 111

      - name: 16. app eof sentinel
        id: g16
        if: always()
        run: test "$(tail -n 1 app.py)" = "# @@EOF"

      - name: 17. no read_timeout
        id: g17
        if: always()
        run: "! grep -n 'read_timeout' app.py"

      - name: 18. no conflict markers
        id: g18
        if: always()
        run: "! grep -rn '^<<<<<<< ' --include='*.py' --exclude-dir=.git ."

      - name: Summary
        if: always()
        env:
          R1: ${{ steps.g1.outcome }}
          R2: ${{ steps.g2.outcome }}
          R3: ${{ steps.g3.outcome }}
          R4: ${{ steps.g4.outcome }}
          R5: ${{ steps.g5.outcome }}
          R6: ${{ steps.g6.outcome }}
          R7: ${{ steps.g7.outcome }}
          R8: ${{ steps.g8.outcome }}
          R9: ${{ steps.g9.outcome }}
          R10: ${{ steps.g10.outcome }}
          R11: ${{ steps.g11.outcome }}
          R12: ${{ steps.g12.outcome }}
          R13: ${{ steps.g13.outcome }}
          R14: ${{ steps.g14.outcome }}
          R15: ${{ steps.g15.outcome }}
          R16: ${{ steps.g16.outcome }}
          R17: ${{ steps.g17.outcome }}
          R18: ${{ steps.g18.outcome }}
        run: |
          fail=0
          {
            echo "## Frame gates"
            echo ""
            echo "| gate | result |"
            echo "| --- | --- |"
            for pair in "fix_end_names.py --check:$R1" "verify_blocks.py:$R2" "audit_frame.py:$R3" "verify_v1337.py:$R4" "test_verdicts.py:$R5" "engine.py --selftest:$R6" "status.py --selftest:$R7" "auth.py --selftest:$R8" "compileall -q .:$R9" "pip install -r requirements.txt:$R10" "pages/5_Blocks.py --fix-check:$R11" "runstate.py --selftest:$R12" "test_resume_io.py:$R13" "app block count 111:$R14" "app end markers 111:$R15" "app eof sentinel:$R16" "no read_timeout:$R17" "no conflict markers:$R18"; do
              g="${pair%%:*}"; r="${pair##*:}"
              if [ "$r" = "success" ]; then echo "| \`$g\` | PASS |"; else echo "| \`$g\` | FAIL |"; fi
              if [ "$r" != "success" ]; then fail=1; fi
            done
            echo ""
            if [ "$fail" -eq 0 ]; then echo "**All eighteen gates green.**"; else echo "**A gate is RED - do not ship.**"; fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit $fail
