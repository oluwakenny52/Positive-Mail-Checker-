name: frame-gates

on:
  push:
  workflow_dispatch:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: 1. fix_end_names --check
        id: g1
        run: python fix_end_names.py --check

      - name: 2. verify_blocks
        id: g2
        run: python verify_blocks.py

      - name: 3. audit_frame
        id: g3
        run: python audit_frame.py

      - name: 4. verify_v1337
        id: g4
        run: python verify_v1337.py

      - name: 5. test_verdicts
        id: g5
        run: python test_verdicts.py

      - name: 6. engine --selftest
        id: g6
        run: python engine.py --selftest

      - name: 7. status alias_selftest
        id: g7
        run: python status.py --selftest

      - name: Summary
        if: always()
        env:
          R1: ${{ steps.g1.outcome }}
          R2: ${{ steps.g2.outcome }}
          R3: ${{ steps.g3.outcome }}
          R4: ${{ steps.g4.outcome }}
          R5: ${{ steps.g5.outcome }}
          R6: ${{ steps.g6.outcome }}
          R7: ${{ steps.g7.outcome }}
        run: |
          fail=0
          {
            echo "## Frame gates"
            echo ""
            echo "| gate | result |"
            echo "| --- | --- |"
            for pair in "fix_end_names.py --check:$R1" "verify_blocks.py:$R2" "audit_frame.py:$R3" "verify_v1337.py:$R4" "test_verdicts.py:$R5" "engine.py --selftest:$R6" "status.py --selftest:$R7"; do
              g="${pair%%:*}"; r="${pair##*:}"
              if [ "$r" = "success" ]; then echo "| \`$g\` | PASS |"; else echo "| \`$g\` | FAIL |"; fail=1; fi
            done
            echo ""
            if [ "$fail" -eq 0 ]; then echo "**All seven gates green.**"; else echo "**A gate is RED - do not ship.**"; fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit $fail
